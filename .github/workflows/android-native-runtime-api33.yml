# Read-only diagnosis of already installed runtime libraries and official package plan.
name: Read-only B2 emulator library preparation diagnosis
on:
  workflow_dispatch:
    inputs:
      reviewed_diagnostic_commit:
        description: Exact full separately reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frozen-b2-runtime
  cancel-in-progress: false
jobs:
  readonly-library-diagnostic:
    if: github.repository == 'gccwebos-com/gccwebos-android' && github.ref == 'refs/heads/codex/lucky-b2-library-diagnostic' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.reviewed_diagnostic_commit }}
      APPROVED_DIAGNOSTIC_SHA256: 7952c378c2ecb6d874fee7c4b76d0d460430a47fa3698500f24e1afa1a8e859b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact reviewed read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_DIAGNOSTIC_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_DIAGNOSTIC_COMMIT"
          printf '%s  %s\n' "$APPROVED_DIAGNOSTIC_SHA256" runtime-proposals/b2/library-preparation-diagnostic.py | sha256sum -c -
          test -z "$(git diff 5d598e662acefd8a470ce13e83c8604b223aef06 HEAD -- app native copyBoundaryLab ownerDeathLab scripts settings.gradle.kts)"
      - name: Read-only library inventory and package simulation; no SDK or Android
        shell: bash
        run: python3 -B runtime-proposals/b2/library-preparation-diagnostic.py
      - name: Bound the raw diagnostic artifact
        id: bounded_diagnostic
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b2-library-diagnostic
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('.build-output/b2-library-diagnostic')
          capture=root/'library-preparation-diagnostic.json'
          summary={'scope':'read-only system metadata and package simulation; B2 runtime NOT_RUN','job_status':os.environ['JOB_STATUS']}
          if capture.is_file() and not capture.is_symlink():
              raw=capture.read_bytes(); data=json.loads(raw)
              summary.update(status=data.get('status'),capture_sha256=hashlib.sha256(raw).hexdigest(),capture_complete=data.get('capture_complete'))
          else:
              summary.update(status='FAILED_BEFORE_CAPTURE',capture_complete=False)
          (root/'result.json').write_text(json.dumps(summary,indent=2)+'\n')
          files=list(root.rglob('*'))
          assert not any(p.is_symlink() for p in files)
          assert not any(p.suffix.lower() in ('.apk','.so','.aar','.zip','.deb') for p in files if p.is_file())
          assert sum(p.stat().st_size for p in files if p.is_file()) < 6*1024*1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.bounded_diagnostic.outcome == 'success'
        with:
          name: owner-death-b2-library-diagnostic-${{ github.sha }}
          path: .build-output/b2-library-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
