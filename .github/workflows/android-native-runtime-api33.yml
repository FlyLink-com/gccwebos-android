# Manual fixed keyring metadata diagnosis only. Original 8fc runtime stays frozen.
name: Read-only B2 Ubuntu archive keyring diagnosis
on:
  workflow_dispatch:
    inputs:
      reviewed_diagnostic_commit:
        description: Exact full separately reviewed read-only diagnostic commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frozen-b2-runtime
  cancel-in-progress: false
jobs:
  readonly-keyring-diagnostic:
    if: github.repository == 'gccwebos-com/gccwebos-android' && github.ref == 'refs/heads/codex/lucky-b2-keyring-diagnostic' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.reviewed_diagnostic_commit }}
      APPROVED_DIAGNOSTIC_SHA256: c3cdb4b04f20bfc0d81efa7bb0c92fb2edf169c8c761c3dcbf04633aad4823ff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify full reviewed head and exact read-only source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_DIAGNOSTIC_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_DIAGNOSTIC_COMMIT"
          printf '%s  %s\n' "$APPROVED_DIAGNOSTIC_SHA256" runtime-proposals/b2/keyring-diagnostic.py | sha256sum -c -
          python3 -B - <<'PY'
          import subprocess
          base='8fc22c28107b4125995883337b5a448e007a57b7'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          assert set(changed)=={'.github/workflows/android-native-runtime-api33.yml','runtime-proposals/b2/keyring-diagnostic.py'}
          PY
      - name: Read fixed keyring metadata and dpkg records; no installation or repair
        shell: bash
        run: python3 -B runtime-proposals/b2/keyring-diagnostic.py
      - name: Bound raw diagnostic evidence
        id: bounded_diagnostic
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b2-keyring-diagnostic
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('.build-output/b2-keyring-diagnostic')
          assert not root.is_symlink()
          capture=root/'keyring-diagnostic.json'
          summary={'scope':'read-only fixed public-key metadata and dpkg verification; B2 runtime NOT_RUN','job_status':os.environ['JOB_STATUS'],'runtime_status':'NOT_RUN'}
          if capture.is_file() and not capture.is_symlink():
              raw=capture.read_bytes(); data=json.loads(raw)
              summary.update(status=data.get('status'),capture_sha256=hashlib.sha256(raw).hexdigest(),capture_complete=data.get('capture_complete'),original_predicate=data.get('original_predicate'))
          else:
              summary.update(status='FAILED_BEFORE_CAPTURE',capture_complete=False)
          (root/'result.json').write_text(json.dumps(summary,indent=2)+'\n')
          allowed={'keyring-diagnostic.json','diagnostic-commit.txt','result.json'}
          for name in ('checkout-head','keyring-package-owner','keyring-package-status','keyring-package-verify'):
              allowed.update({name+'.stdout.log',name+'.stderr.log'})
          files=list(root.rglob('*'))
          assert all(p.is_file() and not p.is_symlink() and p.parent==root and p.name in allowed for p in files)
          assert sum(p.stat().st_size for p in files if p.name.endswith('.log'))<=1024*1024
          assert sum(p.stat().st_size for p in files)<2*1024*1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.bounded_diagnostic.outcome == 'success'
        with:
          name: owner-death-b2-keyring-diagnostic-${{ github.sha }}
          path: .build-output/b2-keyring-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
