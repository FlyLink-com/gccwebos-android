# APPROVED SINGLE RUN: manual dispatch only on codex/lucky-b2-bootstrap-runtime.
# Reuses default-main registered entry; default-main native workflow is unchanged.
# Exact committed harness input and frozen hashes remain mandatory.
name: Approved CLI layout repair and frozen B2 Binder runtime API33
on:
  workflow_dispatch:
    inputs:
      reviewed_harness_commit:
        description: Exact full harness commit separately approved before dispatch
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-b2-runtime
  cancel-in-progress: false
jobs:
  frozen-b2-api33:
    if: github.repository == 'gccwebos-com/gccwebos-android' && github.ref == 'refs/heads/codex/lucky-b2-bootstrap-runtime' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPROVED_HARNESS_COMMIT: ${{ inputs.reviewed_harness_commit }}
      APPROVED_FREEZE_SHA256: f2371983e682dc91227b82bceff360e8633566685dfdf168c47dc272f45677ad
      APPROVED_HARNESS_MANIFEST_SHA256: e1160c213053c3997a3289b3b5fdd6833a72a0b635815a6c8aae630d97b53b2f
      APPROVED_ENVIRONMENT_SHA256: d09768c852ad45568a23fe0481b55a6aec3a76e00848256cf20d73649dbb7118
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify separately reviewed harness and freeze; do not build APKs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_HARNESS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_FREEZE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVED_HARNESS_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_HARNESS_COMMIT"
          PROPOSAL=runtime-proposals/b2
          printf '%s  %s\n' "$APPROVED_HARNESS_MANIFEST_SHA256" "$PROPOSAL/harness-sha256.json" | sha256sum -c -
          python3 - "$PROPOSAL" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          hashes = json.loads((root/'harness-sha256.json').read_text())['files']
          expected = {'ENVIRONMENT-README.md', 'README.md', 'b2-runtime-api33.sh', 'b2-runtime-evidence.py', 'environment-approval.json', 'freeze.json', 'proposed-workflow.yml.disabled', 'provision-and-run.py'}
          assert set(hashes) == expected
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest() == h for p,h in hashes.items())
          PY
          printf '%s  %s\n' "$APPROVED_FREEZE_SHA256" "$PROPOSAL/freeze.json" | sha256sum -c -
          python3 "$PROPOSAL/b2-runtime-evidence.py" check-ready "$PROPOSAL/freeze.json"
      - name: Prepare only approved official packages and temporary KVM; frozen P7-P9 once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 runtime-proposals/b2/provision-and-run.py
      - name: Retain bounded runtime-only evidence on success or failure
        id: bounded_evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b2-runtime
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.build-output/b2-runtime')
          result = root/'result.json'
          if not result.exists():
              result.write_text(json.dumps({'status':'FAILED','overall_exit':1,
                  'job_status':os.environ['JOB_STATUS'],'runtime_summary_missing':True,
                  'owned_child_stopped':False,'owned_serial_absent':False,
                  'owned_temporary_directory_removed':False},indent=2)+'\n')
          data = json.loads(result.read_text())
          data['job_status'] = os.environ['JOB_STATUS']
          prep = root/'environment-preparation.json'
          if not prep.exists() or json.loads(prep.read_text()).get('status') != 'PASS':
              data['status'], data['overall_exit'] = 'FAILED', 1
          if data['job_status'] != 'success':
              data['status'], data['overall_exit'] = 'FAILED', 1
          result.write_text(json.dumps(data,indent=2)+'\n')
          files = [p for p in root.rglob('*') if p.is_file()]
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert not any(p.suffix.lower() in ('.apk','.so','.aar','.zip') for p in files)
          assert sum(p.stat().st_size for p in files) < 28 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.bounded_evidence.outcome == 'success'
        with:
          name: owner-death-b2-runtime-${{ github.sha }}
          path: .build-output/b2-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
