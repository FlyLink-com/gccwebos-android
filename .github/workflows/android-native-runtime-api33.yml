# Read-only cache metadata diagnosis after authorized preparation STOP.
name: Read-only B2 cached package inventory diagnosis
on:
  workflow_dispatch:
    inputs:
      reviewed_harness_commit:
        description: Exact full independently reviewed metadata diagnostic commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frozen-b2-runtime
  cancel-in-progress: false
jobs:
  cached-metadata-only:
    if: github.repository == 'gccwebos-com/gccwebos-android' && github.ref == 'refs/heads/codex/lucky-b2-inventory-diagnostic' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.reviewed_harness_commit }}
      APPROVED_DIAGNOSTIC_SHA256: e5456a281c39cca1d92540e86c608de8028206fe922b5a5617ec7d7339a6793a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact metadata diagnostic source and frozen APK source paths
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_DIAGNOSTIC_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_DIAGNOSTIC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_DIAGNOSTIC_COMMIT"
          git merge-base --is-ancestor 2fe45ac4022aecf57f21effdefbec6df77acbd97 HEAD
          git diff --exit-code 2fe45ac4022aecf57f21effdefbec6df77acbd97 HEAD -- app native copyBoundaryLab ownerDeathLab scripts settings.gradle.kts
          printf '%s  %s\n' "$APPROVED_DIAGNOSTIC_SHA256" runtime-proposals/b2/cache-inventory-diagnostic.py | sha256sum -c -
      - name: Record existing three cached component metadata and exact rejected items
        shell: bash
        run: python3 -B runtime-proposals/b2/cache-inventory-diagnostic.py
      - name: Retain metadata diagnostics including failure; no runtime result
        id: diagnostic_evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b2-inventory-diagnostic
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.build-output/b2-inventory-diagnostic')
          capture = root/'cache-inventory-diagnostic.json'
          summary = {'status':'FAILED_BEFORE_CAPTURE','runtime_status':'NOT_RUN',
              'sdkmanager_invocations':0,'harness_invocations':0,'kvm_permission_changes':0,
              'job_status':os.environ['JOB_STATUS']}
          if capture.exists():
              raw = capture.read_bytes()
              data = json.loads(raw)
              summary.update(status=data['status'],capture_path=capture.name,
                  capture_sha256=hashlib.sha256(raw).hexdigest(),
                  capture_complete=data.get('capture_complete'),
                  predicate_evaluated=data.get('predicate_evaluated'),
                  predicate_pass=data.get('predicate_pass'))
          (root/'result.json').write_text(json.dumps(summary,indent=2)+'\n')
          assert not any(p.is_symlink() for p in root.rglob('*'))
          files = [p for p in root.rglob('*') if p.is_file()]
          assert not any(p.suffix.lower() in ('.apk','.so','.aar','.zip') for p in files)
          assert sum(p.stat().st_size for p in files) < 6 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.diagnostic_evidence.outcome == 'success'
        with:
          name: owner-death-b2-inventory-${{ github.sha }}
          path: .build-output/b2-inventory-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
