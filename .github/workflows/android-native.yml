name: Native VPN isolated build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'app/**'
      - 'scripts/verify_source.py'
      - 'scripts/verify_release_policy.py'
      - 'scripts/test_release_policy.py'
      - 'scripts/verify_native_apks.py'
      - 'scripts/real-tun-runtime-api33.sh'
      - 'scripts/verify_real_tun_acceptance.py'
      - 'scripts/materialize-native-libraries.py'
      - 'scripts/test-native-library-reuse.py'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source boundary and record identity
        run: |
          set -euo pipefail
          mkdir -p .build-output/native
          git rev-parse HEAD | tee .build-output/native/source-commit.txt
          python3 scripts/verify_source.py
          python3 scripts/test_release_policy.py
          python3 scripts/test-native-library-reuse.py
      - name: Install pinned Android native toolchain
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Restore source-identical native libraries when eligible
        id: native_restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eligible=0
          python3 scripts/materialize-native-libraries.py --can-reuse || eligible=$?
          if [ "$eligible" = 3 ]; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$eligible" = 0
          if ! gh api repos/gccwebos-com/gccwebos-android/actions/artifacts/11306235582 \
            > "$RUNNER_TEMP/native-reuse-metadata.json" 2> "$RUNNER_TEMP/native-reuse-error.log"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/native-reuse-error.log"; then
              echo 'Pinned cache artifact unavailable; fresh source build required'
              echo 'reused=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/native-reuse-error.log"
            exit 1
          fi
          # Expiration is a normal cache miss. Digest/source mismatches remain hard failures.
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["expired"] else 1)' "$RUNNER_TEMP/native-reuse-metadata.json"; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api repos/gccwebos-com/gccwebos-android/actions/artifacts/11306235582/zip \
            > "$RUNNER_TEMP/native-reuse.zip"
          python3 scripts/materialize-native-libraries.py "$RUNNER_TEMP/native-reuse.zip" "$RUNNER_TEMP/native-reuse-metadata.json"
          echo 'reused=true' >> "$GITHUB_OUTPUT"
      - name: Verify pinned upstream and Go dependency graph
        if: steps.native_restore.outputs.reused != 'true'
        run: |
          set -euo pipefail
          bash native/scripts/prepare.sh 2>&1 | tee .build-output/native/prepare.log
      - name: Export Kotlin goldens and compile gated acceptance harness
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PnativeVpnLab=true -PnativeTunAcceptance=true \
            :app:testDebugUnitTest --tests "*ProtocolContractTest" :app:assembleDebugAndroidTest :app:lintDebug \
            2>&1 | tee .build-output/native/kotlin-contract.log
      - name: Real packet-path tests with loopback-only fixtures
        if: steps.native_restore.outputs.reused != 'true'
        env:
          GCC_PROTOCOL_GOLDENS: ${{ github.workspace }}/.build-output/protocol-contract
        run: |
          set -euo pipefail
          python3 -m venv .native-venv
          source .native-venv/bin/activate
          python3 -m pip install -r native/scripts/requirements-host-test.txt
          bash native/scripts/test-host.sh 2>&1 | tee .build-output/native/packet-tests.log
      - name: Cross-build arm64-v8a and x86_64
        if: steps.native_restore.outputs.reused != 'true'
        run: |
          set -euo pipefail
          bash native/scripts/build-native.sh arm64-v8a x86_64 2>&1 | tee .build-output/native/build.log
      - name: Stage validated native libraries for fresh app packaging
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            cp "native/build/jniLibs/$abi/elf-program-headers.txt" ".build-output/native/$abi-elf-program-headers.txt"
            cp "native/build/jniLibs/$abi/elf-dynamic.txt" ".build-output/native/$abi-elf-dynamic.txt"
          done
          sha256sum native/build/jniLibs/*/*.so | tee .build-output/native/libraries.sha256
      - name: Compile opt-in lab APK and verify production JNI and release lab exclusion
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh
          ./gradlew --no-daemon --console=plain -PnativeVpnLab=true -PnativeTunAcceptance=true \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease \
            2>&1 | tee .build-output/native/android-build.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | tee .build-output/native/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk \
            | tee .build-output/native/apk-alignment.txt
          python3 scripts/verify_native_apks.py
          python3 scripts/collect_build_evidence.py
          cp .build-output/build-manifest.json .build-output/native/build-manifest.json
          sha256sum app/build/outputs/apk/debug/*.apk | tee .build-output/native/apks.sha256
      - name: Load freshly built JNI APK on Android13 API33
        env:
          REQUIRE_NATIVE_JNI: 'true'
          REQUIRE_REAL_TUN: 'true'
        run: |
          set -euo pipefail
          # Only disposable compiler/module caches. Keep artifacts and all verification receipts.
          if [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ -d native/build/gocache ] && [ -d native/build/gopath ]; then
            du -sh native/build/gocache native/build/gopath | tee .build-output/native/cache-disk.log
            # Go owns the read-only module-cache permissions; use its official cleaner.
            env GOTOOLCHAIN=local GOPATH="$PWD/native/build/gopath" GOCACHE="$PWD/native/build/gocache" \
              "$PWD/native/toolchain/go/bin/go" clean -cache -modcache \
              2>&1 | tee .build-output/native/cache-clean.log
          fi
          # Run the freshly built and hashed APKs above, not the old artifact materializer.
          # API36 UI coverage remains a separate standard workflow; known host ANRs
          # must not be mislabeled as an app/JNI failure or silently ignored.
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            | tee .build-output/native/fresh-runtime-apks-before.sha256
          bash scripts/real-tun-runtime-api33.sh
          sha256sum -c .build-output/native/fresh-runtime-apks-before.sha256
      - name: Retain small real-TUN diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gccwebos-real-tun-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .build-output/runtime-api33/device/real-tun-evidence/
            .build-output/runtime-api33/device/real-tun-instrumentation.log
            .build-output/runtime-api33/device/connectivity-final.log
            .build-output/runtime-api33/device/crash.log
            .build-output/native/source-commit.txt
            .build-output/native/native-reuse.json
            .build-output/native/fresh-runtime-apks-before.sha256
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain source, native and Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gccwebos-native-vpn-lab-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .build-output/native/
            .build-output/protocol-contract/
            .build-output/device/
            .build-output/runtime-api33/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/test-results/
            app/build/reports/
            native/build/jniLibs/
            native/notices/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
