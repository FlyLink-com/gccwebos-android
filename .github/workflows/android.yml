name: Android M0 build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: android-m0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # This dedicated candidate branch builds QA APKs only. Installing or executing
  # either new package is a separate approval gate, including on hosted runners.
  copy-boundary-compile:
    if: startsWith(github.head_ref || github.ref_name, 'codex/lucky-e2b-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile bounded QA component and both APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-output/copy-boundary/ledger
          git rev-parse HEAD | tee .build-output/copy-boundary/source-commit.log
          chmod +x gradlew
          javac -d .build-output/copy-boundary/ledger copyBoundaryLab/src/main/java/com/gccwebos/android/ipcqa/CopyLedger.java copyBoundaryLab/src/test/java/com/gccwebos/android/ipcqa/CopyLedgerSmoke.java
          java -cp .build-output/copy-boundary/ledger com.gccwebos.android.ipcqa.CopyLedgerSmoke | tee .build-output/copy-boundary/ledger-smoke.log
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          ./gradlew --no-daemon --console=plain -PcopyBoundaryLab=true :copyBoundaryLab:assembleDebug :copyBoundaryLab:assembleDebugAndroidTest :copyBoundaryLab:lintDebug 2>&1 | tee .build-output/copy-boundary/build.log
          python3 scripts/collect_copy_boundary_evidence.py "$SDK_ROOT" .build-output/copy-boundary
      - name: Retain QA candidate, manifests and compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copy-boundary-b1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            copyBoundaryLab/build/outputs/apk/
            copyBoundaryLab/build/reports/
            .build-output/copy-boundary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  validate:
    if: "!startsWith(github.head_ref || github.ref_name, 'codex/lucky-e2b-')"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Record source identity and verify Wrapper
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-output
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD | tee .build-output/source-commit.log
          git diff --check HEAD^ HEAD
          chmod +x gradlew build.sh scripts/*.sh
          sh scripts/bootstrap-wrapper.sh 2>&1 | tee .build-output/wrapper.log
          python3 scripts/verify_source.py | tee .build-output/source-validation.log
          sha256sum gradle/wrapper/gradle-wrapper.jar | tee .build-output/wrapper.sha256
          git archive --format=zip HEAD -o .build-output/source.zip
      - name: Retain verified Wrapper bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gccwebos-m0-wrapper-${{ steps.source.outputs.sha }}
          path: |
            gradle/wrapper/
            .build-output/wrapper.sha256
            .build-output/source.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Install explicit SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tee .build-output/sdk-install.log
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          java -version 2>&1 | tee .build-output/java.log
          ./gradlew --version 2>&1 | tee .build-output/gradle-version.log
      - name: Debug build, JUnit, Lint and test APK compilation
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          ./gradlew --no-daemon --console=plain :app:assembleDebugAndroidTest 2>&1 | tee .build-output/android-test-build.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee .build-output/apk-signature.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee .build-output/test-apk-signature.log
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee .build-output/apks.sha256
          python3 scripts/collect_build_evidence.py | tee .build-output/manifest.log
      - name: Attach verified build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gccwebos-m0-debug-${{ steps.source.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            .build-output/build-manifest.json
            .build-output/apks.sha256
            .build-output/*signature.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Install, launch and test the same APK on an emulator
        if: steps.build.outcome == 'success'
        shell: bash
        run: bash scripts/m0-emulator-smoke.sh
      - name: Attach logs and actual device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gccwebos-m0-reports-${{ steps.source.outputs.sha }}
          path: |
            .build-output/*.log
            .build-output/*.sha256
            .build-output/device/
            app/build/test-results/
            app/build/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
