name: Frozen B1 Binder runtime API33
on:
  push:
    branches: [codex/lucky-b1-runtime]
    paths:
      - '.github/workflows/copy-boundary-b1-runtime.yml'
      - 'scripts/copy-boundary-b1-runtime.sh'
      - 'scripts/materialize-copy-boundary-b1.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-b1-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-b1-api33:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize only the two approved immutable APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b1-runtime
          git rev-parse HEAD > .build-output/b1-runtime/harness-commit.txt
          test "$(git rev-parse e3e67b7dbd3b01e59ccb41a8f81ac13007717f19^{tree})" = f053c32a42a0b89fbaef2f1f3bcf5453af4e9847
          git diff --exit-code e3e67b7dbd3b01e59ccb41a8f81ac13007717f19 HEAD -- app copyBoundaryLab settings.gradle.kts scripts/collect_copy_boundary_evidence.py .github/workflows/android.yml
          git diff --name-only e3e67b7dbd3b01e59ccb41a8f81ac13007717f19 HEAD > .build-output/b1-runtime/harness-changed-paths.txt
          gh api repos/gccwebos-com/gccwebos-android/actions/artifacts/11190823908 > "$RUNNER_TEMP/b1-artifact-metadata.json"
          gh api repos/gccwebos-com/gccwebos-android/actions/artifacts/11190823908/zip > "$RUNNER_TEMP/b1-artifact.zip"
          python3 scripts/materialize-copy-boundary-b1.py materialize "$RUNNER_TEMP/b1-artifact.zip" "$RUNNER_TEMP/b1-artifact-metadata.json" "$RUNNER_TEMP/b1-frozen"
          cp "$RUNNER_TEMP/b1-frozen/artifact-metadata.json" "$RUNNER_TEMP/b1-frozen/provenance.json" .build-output/b1-runtime/
      - name: Install official SDK tools and verify actual immutable manifests/signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          timeout 300 "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-33;default;x86_64' 2>&1 | tee .build-output/b1-runtime/sdk-install.log
          python3 scripts/materialize-copy-boundary-b1.py verify "$SDK_ROOT" "$RUNNER_TEMP/b1-frozen"
          cp "$RUNNER_TEMP/b1-frozen/identity.json" .build-output/b1-runtime/
          cp -r "$RUNNER_TEMP/b1-frozen/verification" .build-output/b1-runtime/
      - name: Run approved P1-P6 once, one method at a time, stop at first failure
        run: bash scripts/copy-boundary-b1-runtime.sh
      - name: Retain runtime-only evidence regardless of failure
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .build-output/b1-runtime
          find .build-output/b1-runtime -type f -name '*.log' -size +2M -exec gzip '{}' \;
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = Path('.build-output/b1-runtime/result.json')
          if not result.exists():
              methods = ['p1RemoteIdentity','p2OwnedCopyAndWipe','p3BoundedActualParcels','p4ClearBeforeCopyAndLateAck','p5OriginalStopTicketAcrossGeneration','p6UnknownKeepsClaimUntilCallReturns']
              records = []
              for method in methods:
                  p = result.parent/(method+'.json')
                  records.append(json.loads(p.read_text()) if p.exists() else {'method':method,'status':'NOT_RUN','started':False,'completed':False})
              result.write_text(json.dumps({'job_status':os.environ['JOB_STATUS'],'runtime_summary_missing':True,'methods':records},indent=2)+'\n')
          paths = [p for p in Path('.build-output/b1-runtime').rglob('*') if p.is_file()]
          assert not any(p.suffix in ('.apk', '.so', '.aar', '.zip') for p in paths)
          assert sum(p.stat().st_size for p in paths) < 28 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: copy-boundary-b1-runtime-${{ github.sha }}
          path: .build-output/b1-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
