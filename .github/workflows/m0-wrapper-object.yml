name: M0 one-time verified Wrapper object
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/m0-wrapper-object.yml']
permissions: {}
jobs:
  store-verified-wrapper:
    if: github.repository == 'gccwebos-com/gccwebos-android' && github.head_ref == 'fix/m0-build-closeout' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # No checkout, Gradle, project scripts or untrusted input is executed here.
      # Creates one immutable Git blob only; no ref/branch/file is updated.
      # Remove this temporary workflow once the connector has added the blob to the PR.
      - name: Verify upstream bytes and store immutable blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          expected = '55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c'
          url = 'https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(100000)
          if len(data) != 48966 or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Wrapper verification failed; nothing stored')
          expected_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/gccwebos-com/gccwebos-android/git/blobs', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          if result.get('sha') != expected_blob:
              raise SystemExit('Unexpected blob identity')
          print('Verified Wrapper SHA-256:', expected)
          print('Stored Git blob:', expected_blob)
          print('No branch, ref or file was updated by this job.')
          PY
