mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic HY2 BBR aggressive"
    type: hysteria2
    server: "192.0.2.10"
    port: 443
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    skip-cert-verify: false
    alpn:
      - "h3"
    bbr-profile: "aggressive"
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic HY2 BBR aggressive"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic HY2 BBR aggressive"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic HY2 BBR aggressive"
rules:
  - MATCH,GLOBAL
