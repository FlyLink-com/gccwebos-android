mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
proxies:
  - name: "Synthetic HY2 bounded options"
    type: hysteria2
    server: "192.0.2.10"
    port: 443
    password: "synthetic-only"
    up: "100 Mbps"
    down: "200 Mbps"
    obfs: "salamander"
    obfs-password: "synthetic-obfs-only"
    sni: "fixture.example.invalid"
    alpn:
      - "h3"
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic HY2 bounded options"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic HY2 bounded options"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic HY2 bounded options"
rules:
  - MATCH,GLOBAL
