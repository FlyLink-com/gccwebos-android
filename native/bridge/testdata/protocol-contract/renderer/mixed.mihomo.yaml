mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
proxies:
  - name: "Synthetic SS"
    type: ss
    server: "192.0.2.10"
    port: 443
    cipher: "aes-128-gcm"
    password: "synthetic-only"
  - name: "Synthetic Reality"
    type: vless
    server: "192.0.2.10"
    port: 443
    uuid: "11111111-1111-4111-8111-111111111111"
    udp: true
    packet-encoding: "xudp"
    tls: true
    servername: "fixture.example.invalid"
    network: "tcp"
    flow: "xtls-rprx-vision"
    reality-opts:
      public-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE"
      short-id: "0123456789abcdef"
    client-fingerprint: "chrome"
  - name: "Synthetic HY2"
    type: hysteria2
    server: "192.0.2.10"
    port: 443
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    skip-cert-verify: false
    alpn:
      - "h3"
  - name: "Synthetic TUIC"
    type: tuic
    server: "192.0.2.10"
    port: 443
    uuid: "22222222-2222-4222-8222-222222222222"
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    skip-cert-verify: false
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic SS"
      - "Synthetic Reality"
      - "Synthetic HY2"
      - "Synthetic TUIC"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic SS"
      - "Synthetic Reality"
      - "Synthetic HY2"
      - "Synthetic TUIC"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic SS"
      - "Synthetic Reality"
      - "Synthetic HY2"
      - "Synthetic TUIC"
rules:
  - MATCH,GLOBAL
