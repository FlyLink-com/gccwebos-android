mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
proxies:
  - name: "Synthetic hostname"
    type: ss
    server: "node.example.invalid"
    port: 443
    cipher: "aes-128-gcm"
    password: "synthetic-only"
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic hostname"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic hostname"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic hostname"
rules:
  - MATCH,GLOBAL
