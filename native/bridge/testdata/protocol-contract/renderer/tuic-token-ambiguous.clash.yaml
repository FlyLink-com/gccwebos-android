mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic legacy TUIC"
    type: tuic
    server: "192.0.2.10"
    port: 443
    uuid: "22222222-2222-4222-8222-222222222222"
    password: "synthetic-only"
    token: "synthetic-legacy-token"
    disable-sni: true
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic legacy TUIC"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic legacy TUIC"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic legacy TUIC"
rules:
  - MATCH,GLOBAL
