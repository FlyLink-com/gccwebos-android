mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
proxies:
  - name: "Synthetic TUIC default tuple"
    type: tuic
    server: "192.0.2.10"
    port: 443
    uuid: "22222222-2222-4222-8222-222222222222"
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    disable-sni: false
    reduce-rtt: false
    heartbeat-interval: 10000
    max-udp-relay-packet-size: 1252
    fast-open: false
    skip-cert-verify: false
    max-open-streams: 100
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC default tuple"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC default tuple"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic TUIC default tuple"
rules:
  - MATCH,GLOBAL
