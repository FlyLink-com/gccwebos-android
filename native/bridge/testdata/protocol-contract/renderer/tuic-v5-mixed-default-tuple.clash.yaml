mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic TUIC mixed default tuple"
    type: tuic
    server: "192.0.2.10"
    port: 443
    uuid: "22222222-2222-4222-8222-222222222222"
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    disable-sni: false
    reduce-rtt: false
    heartbeat-interval: 0
    max-udp-relay-packet-size: 1252
    fast-open: false
    skip-cert-verify: false
    max-open-streams: 0
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC mixed default tuple"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC mixed default tuple"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic TUIC mixed default tuple"
rules:
  - MATCH,GLOBAL
