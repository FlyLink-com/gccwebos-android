mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic TUIC request timeout 8000"
    type: tuic
    server: "192.0.2.10"
    port: 443
    uuid: "22222222-2222-4222-8222-222222222222"
    password: "synthetic-only"
    sni: "fixture.example.invalid"
    request-timeout: 8000
    skip-cert-verify: false
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC request timeout 8000"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic TUIC request timeout 8000"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic TUIC request timeout 8000"
rules:
  - MATCH,GLOBAL
