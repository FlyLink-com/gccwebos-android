mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
proxies:
  - name: "Synthetic VLESS defaults"
    type: vless
    server: "192.0.2.10"
    port: 443
    uuid: "11111111-1111-4111-8111-111111111111"
    udp: false
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic VLESS defaults"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic VLESS defaults"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic VLESS defaults"
rules:
  - MATCH,GLOBAL
