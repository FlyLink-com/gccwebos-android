mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic Reality"
    type: vless
    server: "192.0.2.10"
    port: 443
    uuid: "11111111-1111-4111-8111-111111111111"
    udp: true
    packet-encoding: "xudp"
    tls: true
    servername: "fixture.example.invalid"
    network: "tcp"
    flow: "xtls-rprx-vision"
    reality-opts:
      public-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE"
      short-id: "0123456789abcdef"
    client-fingerprint: "chrome"
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic Reality"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic Reality"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic Reality"
rules:
  - MATCH,GLOBAL
