mixed-port: 7897
allow-lan: false
mode: global
proxies:
  - name: "Synthetic VLESS TLS"
    type: vless
    server: "192.0.2.10"
    port: 443
    uuid: "11111111-1111-4111-8111-111111111111"
    udp: false
    tls: true
    servername: "fixture.example.invalid"
    network: "tcp"
proxy-groups:
  - name: AUTO
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic VLESS TLS"
  - name: FALLBACK
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Synthetic VLESS TLS"
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - "Synthetic VLESS TLS"
rules:
  - MATCH,GLOBAL
